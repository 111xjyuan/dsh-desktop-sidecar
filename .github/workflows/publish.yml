name: publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use latest npm (needs `npm stage` for staged publishing)
        run: npm install -g npm@latest && npm --version
      - name: Publish
        id: publish
        continue-on-error: true
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Stage then approve
        if: steps.publish.outcome == 'failure'
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "::notice::staging $NAME@$VERSION"
          npm stage publish
          npm stage list "$NAME"
          ID=$(npm stage list "$NAME" | awk '/^id: /{print $2; exit}')
          echo "::notice::stage id $ID"
          npm stage approve "$ID"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
